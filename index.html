<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador de Personajes · Rick and Morty</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="encabezado">
    <h1>Explorador de Rick and Morty</h1>
    <p>Variante A · Buscador de Personajes</p>
  </header>

  <main class="contenedor">
    <section aria-label="Buscador de personajes">
      <form id="form-busqueda" class="buscador">
        <div class="campo">
          <label for="input-nombre">Nombre del personaje</label>
          <input type="text" id="input-nombre" name="name" placeholder="Ej: Rick, Morty, Summer...">
        </div>

        <div class="campo">
          <label for="select-estado">Estado</label>
          <select id="select-estado" name="status">
            <option value="">Todos</option>
            <option value="alive">Vivo</option>
            <option value="dead">Muerto</option>
            <option value="unknown">Desconocido</option>
          </select>
        </div>

        <button type="submit" id="btn-buscar">Buscar</button>
      </form>
    </section>

    <p id="mensaje-estado" class="mensaje" aria-live="polite"></p>

    <section id="grilla-resultados" class="grilla" aria-label="Resultados de búsqueda"></section>
  </main>

  <footer class="pie">
    <p>Desarrollado por Fiorella González · Fundamentos de Desarrollo Web · UCSA</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
